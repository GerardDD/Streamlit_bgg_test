name: Descarregar col·lecció i partides de BGG

on:
  # Cada dia a les 04:23 UTC
  schedule:
    - cron: "23 4 * * *"
  # Manualment des de la pestanya Actions
  workflow_dispatch:
    inputs:
      only:
        description: "Què cal descarregar"
        type: choice
        options: [tot, collection, plays]
        default: tot

permissions:
  contents: write

concurrency:
  group: update-bgg-data
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instal·lar dependències
        run: pip install pandas requests

      - name: Descarregar de BGG
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
          # Usuari de BGG: variable del repositori BGG_USERNAME (per defecte Mrbrussels)
          BGG_USERNAME: ${{ vars.BGG_USERNAME }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ] && [ "$ONLY" != "tot" ]; then
            python scripts/download_bgg_data.py --only "$ONLY"
          else
            python scripts/download_bgg_data.py
          fi

      # Els push fets amb GITHUB_TOKEN no disparen altres workflows,
      # així que les mecàniques dels jocs nous s'actualitzen aquí mateix.
      - name: Actualitzar mecàniques dels jocs nous
        if: ${{ !inputs.only || inputs.only != 'plays' }}
        env:
          BGG_API_TOKEN: ${{ secrets.BGG_API_TOKEN }}
        run: python scripts/update_mechanics_cache.py

      - name: Commit si hi ha canvis
        run: |
          FILES="pages/collection.csv pages/playsMrbrussels.csv pages/bgg_mechanics_cache.csv"
          if git diff --quiet -- $FILES; then
            echo "Cap canvi a les dades."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Actualitzar col·lecció i partides de BGG"
          git push
